name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sayso-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        env:
          SAYSO_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SAYSO_KEYSTORE_PASSWORD: ${{ secrets.SAYSO_KEYSTORE_PASSWORD }}
          SAYSO_KEY_ALIAS: ${{ secrets.SAYSO_KEY_ALIAS }}
          SAYSO_KEY_PASSWORD: ${{ secrets.SAYSO_KEY_PASSWORD }}
          # Read through the environment rather than expanded into the script, so
          # nothing in a secret is ever interpreted by the shell.
          SAYSO_KEYSTORE_B64: ${{ secrets.SAYSO_KEYSTORE_B64 }}
        run: |
          printf '%s' "$SAYSO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk "sayso-${GITHUB_REF_NAME}.apk"

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@v2
        with:
          files: sayso-${{ github.ref_name }}.apk
