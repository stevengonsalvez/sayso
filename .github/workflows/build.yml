name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build unsigned release (R8 check)
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sayso-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build signed release APK and App Bundle
        env:
          SAYSO_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SAYSO_KEYSTORE_PASSWORD: ${{ secrets.SAYSO_KEYSTORE_PASSWORD }}
          SAYSO_KEY_ALIAS: ${{ secrets.SAYSO_KEY_ALIAS }}
          SAYSO_KEY_PASSWORD: ${{ secrets.SAYSO_KEY_PASSWORD }}
          # Read through the environment rather than expanded into the script, so
          # nothing in a secret is ever interpreted by the shell.
          SAYSO_KEYSTORE_B64: ${{ secrets.SAYSO_KEYSTORE_B64 }}
        run: |
          printf '%s' "$SAYSO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk "sayso-${GITHUB_REF_NAME}.apk"
          mv app/build/outputs/bundle/release/app-release.aab "sayso-${GITHUB_REF_NAME}.aab"

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            sayso-${{ github.ref_name }}.apk
            sayso-${{ github.ref_name }}.aab
