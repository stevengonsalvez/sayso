name: macOS

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Build & Test (macOS)
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: macos
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check Package.resolved drift
        run: git diff --exit-code Package.resolved

      - name: Install icon tooling
        run: |
          if ! command -v rsvg-convert >/dev/null; then
            brew install librsvg
          fi

      - name: Run native tests with test keychain
        run: python3 Scripts/with-test-keychain.py swift test --enable-code-coverage --parallel

      - name: Report Coverage
        if: always()
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          XCTEST_PATH=$(find "$BIN_PATH" -name '*.xctest' -type d | head -1)
          if [ -n "$XCTEST_PATH" ]; then
            EXEC_PATH="$XCTEST_PATH/Contents/MacOS/$(basename "$XCTEST_PATH" .xctest)"
            COV_DIR=$(swift test --show-codecov-path 2>/dev/null || echo "")
            if [ -n "$COV_DIR" ] && [ -f "$COV_DIR" ]; then
              echo "### Test Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
              xcrun llvm-cov report "$EXEC_PATH" \
                --instr-profile="$(dirname "$COV_DIR")/default.profdata" \
                --ignore-filename-regex='\.build|Tests/' 2>/dev/null | head -30 >> "$GITHUB_STEP_SUMMARY" || true
            fi
          fi

      - name: Package development artifact
        env:
          SAYSO_CODESIGN_IDENTITY: "-"
        run: ./Scripts/package-app.sh

      - name: Validate app bundle
        run: |
          app_path='.artifacts/Sayso Notch.app'
          test -x "$app_path/Contents/MacOS/SaysoNotch"
          plutil -lint "$app_path/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -d --entitlements :- "$app_path" 2>&1 | grep -q 'com.apple.security.device.audio-input'

      - name: Report Gatekeeper development-artifact status
        continue-on-error: true
        run: spctl --assess --type execute --verbose=4 '.artifacts/Sayso Notch.app'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sayso-notch-development-build
          path: macos/.artifacts/Sayso Notch.app
          retention-days: 7
